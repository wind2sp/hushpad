# Windows 앱 빌드 — 손으로 실행 (Actions › build-windows › Run workflow).
# 공개 저장소라 GitHub에서 무료로 돈다. 코드 서명(SignPath Foundation)은 이 빌드 결과에만 붙일 수 있어서
# 배포용 Windows zip은 이 워크플로에서 만든다.
# 결과: Hushpad-win64.zip (+ 같은 내용의 Actions 결과물 "Hushpad-win64-unsigned") → 초안 릴리스 "win-build"
name: build-windows

on:
  workflow_dispatch:

permissions:
  contents: write   # 초안(draft) 릴리스에 zip을 올리기 위해

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Self-test (source)
        env:
          QT_QPA_PLATFORM: offscreen
          HUSHPAD_SELFTEST_VERBOSE: "1"
        shell: bash
        run: |
          python -X faulthandler hushpad_main.py --selftest || { cat "$(python -c 'import tempfile;print(tempfile.gettempdir())')/hushpad_selftest.txt"; exit 1; }

      - name: Build Hushpad (includes self-test of the exe and the zip)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python build.py

      - name: Show result
        shell: bash
        run: |
          ls -la dist
          cat dist/Hushpad-win64.zip.sha256

      # SignPath Foundation 승인 후: 아래 결과물을 SignPath에 보내 서명받고, 서명된 파일로 zip을 다시 만든다.
      # (signpath/github-action-submit-signing-request 단계는 승인 뒤 프로젝트 정보를 받아 추가)
      - uses: actions/upload-artifact@v4
        id: unsigned
        with:
          name: Hushpad-win64-unsigned
          path: dist/Hushpad/
          retention-days: 14

      - name: Upload to draft release "win-build" (not public)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG=win-build
          if ! gh release list --json tagName --jq '.[].tagName' | grep -qx "$TAG"; then
            gh release create "$TAG" --draft --prerelease --target "$GITHUB_SHA" \
              --title "Windows 테스트 빌드 (비공개 초안)" \
              --notes "build-windows 워크플로가 자동으로 올리는 Windows 빌드입니다. 공개 릴리스가 아닙니다."
          fi
          gh release upload "$TAG" dist/Hushpad-win64.zip dist/Hushpad-win64.zip.sha256 --clobber
