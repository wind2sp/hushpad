# macOS 앱 빌드 — 손으로만 실행 (Actions › build-macos › Run workflow).
# push·PR에는 돌지 않는다 (릴리스할 때만 손으로 실행).
# 결과: Hushpad-macos-<arm64|x86_64>.zip → 초안 릴리스 "mac-build"에 올라감 (서명·공증 없음 — 처음 열 때 오른쪽 클릭 › 열기)
name: build-macos

on:
  workflow_dispatch:

permissions:
  contents: write   # 초안(draft) 릴리스에 zip을 올리기 위해

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest = Apple Silicon(arm64). Intel Mac 빌드는 만들지 않는다.
        include: [{"runner": "macos-latest", "arch": "arm64"}]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Self-test (source)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          HUSHPAD_SELFTEST_VERBOSE=1 python -X faulthandler hushpad_main.py --selftest || { cat "$(python -c 'import tempfile;print(tempfile.gettempdir())')/hushpad_selftest.txt"; exit 1; }

      - name: Build Hushpad.app (includes self-test of the bundle)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python build.py

      - name: Zip
        run: ditto -c -k --keepParent dist/Hushpad.app "Hushpad-macos-${{ matrix.arch }}.zip"

      # 결과물 보관함(artifact)은 계정 전체 용량을 함께 써서 가득 찰 수 있다 → 공개되지 않는 초안 릴리스에 올린다.
      - name: Upload to draft release "mac-build" (not public)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=mac-build
          # 초안 릴리스는 태그가 아직 없어 "release view"로 못 찾으므로 목록에서 이름으로 찾는다
          if ! gh release list --json tagName --jq '.[].tagName' | grep -qx "$TAG"; then
            gh release create "$TAG" --draft --prerelease --target "$GITHUB_SHA"               --title "macOS 테스트 빌드 (비공개 초안)"               --notes "build-macos 워크플로가 자동으로 올리는 Mac 테스트 빌드입니다. 서명·공증 없음. 공개 릴리스가 아닙니다."
          fi
          gh release upload "$TAG" "Hushpad-macos-${{ matrix.arch }}.zip" --clobber

      - uses: actions/upload-artifact@v4
        continue-on-error: true   # 용량이 비어 있을 때만 덤으로
        with:
          name: Hushpad-macos-${{ matrix.arch }}
          path: Hushpad-macos-${{ matrix.arch }}.zip
          retention-days: 14
